<header class="site-header" id="header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V10l2.5-4 2.5 4v11M9.5 21V7l2.5-4 2.5 4v14M15 21V10l2.5-4 2.5 4v11"/><line class="rail" x1="2" y1="13.5" x2="22" y2="13.5"/></svg>
      <span>Winnipeg Fence <em>Installation</em></span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Primary">
      <a href="{{ '/#services' | relative_url }}">Services</a>
      <a href="{{ '/#how-it-works' | relative_url }}">How It Works</a>
      <a href="{{ '/#faq' | relative_url }}">FAQ</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>

    <div class="header-actions">

        <span>{{ site.data.business.phone_display }}</span>

      <a class="btn btn-primary btn-sm" href="{{ '/#quote' | relative_url }}">Get Free Quote</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
